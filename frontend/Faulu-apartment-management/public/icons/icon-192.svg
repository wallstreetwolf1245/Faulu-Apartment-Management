<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" fill="url(#grad1)" />
  
  <!-- Building icon -->
  <g transform="translate(48, 40)">
    <!-- Main building shape -->
    <rect x="0" y="0" width="96" height="112" fill="white" rx="8" />
    
    <!-- Windows grid -->
    <rect x="12" y="12" width="16" height="16" fill="#2563eb" rx="2" />
    <rect x="40" y="12" width="16" height="16" fill="#2563eb" rx="2" />
    <rect x="68" y="12" width="16" height="16" fill="#2563eb" rx="2" />
    
    <rect x="12" y="40" width="16" height="16" fill="#2563eb" rx="2" />
    <rect x="40" y="40" width="16" height="16" fill="#2563eb" rx="2" />
    <rect x="68" y="40" width="16" height="16" fill="#2563eb" rx="2" />
    
    <rect x="12" y="68" width="16" height="16" fill="#2563eb" rx="2" />
    <rect x="40" y="68" width="16" height="16" fill="#2563eb" rx="2" />
    <rect x="68" y="68" width="16" height="16" fill="#2563eb" rx="2" />
    
    <!-- Door -->
    <rect x="36" y="90" width="24" height="22" fill="#1d4ed8" rx="4" />
    <circle cx="56" cy="101" r="2" fill="white" />
  </g>
</svg>
