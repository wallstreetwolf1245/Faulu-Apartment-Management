    <rect x="0" y="0" width="256" height="300" fill="white" rx="20" />
    
    <!-- Windows grid -->
    <g fill="#2563eb">
      <rect x="32" y="32" width="40" height="40" rx="4" />
      <rect x="108" y="32" width="40" height="40" rx="4" />
      <rect x="184" y="32" width="40" height="40" rx="4" />
      
      <rect x="32" y="110" width="40" height="40" rx="4" />
      <rect x="108" y="110" width="40" height="40" rx="4" />
      <rect x="184" y="110" width="40" height="40" rx="4" />
      
      <rect x="32" y="188" width="40" height="40" rx="4" />
      <rect x="108" y="188" width="40" height="40" rx="4" />
      <rect x="184" y="188" width="40" height="40" rx="4" />
    </g>
    
    <!-- Door -->
    <rect x="96" y="240" width="64" height="60" fill="#1d4ed8" rx="8" />
    <circle cx="148" cy="272" r="6" fill="white" />
  </g>
