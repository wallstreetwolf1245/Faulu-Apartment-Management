services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: FauluApartmentDb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d FauluApartmentDb"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./backend/FauluApartmentAPI
      target: final
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/Faulu-apartment-management
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  sqlserver-data:
  postgres-data: